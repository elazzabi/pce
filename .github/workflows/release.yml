name: GitHub Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing matching version tag to validate without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      source-revision: ${{ steps.release.outputs.source-revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - id: release
        name: Require a matching immutable version tag
        run: |
          python3 scripts/build_release.py validate-tag --tag "$RELEASE_TAG"
          source_revision="$(git rev-parse HEAD)"
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ] || [ "$source_revision" != "$GITHUB_SHA" ]; then
            echo "Dry runs must be dispatched from the selected tag ref: gh workflow run release.yml --ref $RELEASE_TAG -f tag=$RELEASE_TAG" >&2
            exit 1
          fi
          echo "source-revision=$source_revision" >> "$GITHUB_OUTPUT"

      - name: Test the tagged source
        run: |
          sh -n install.sh
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s tests -p 'test_*.py'

  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source-revision }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build and verify the universal release asset
        run: |
          python3 scripts/build_release.py build \
            --output release \
            --source-revision "${{ needs.validate.outputs.source-revision }}"
          python3 scripts/build_release.py verify \
            --manifest release/release-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: candidate-release
          path: |
            release/*.tar.gz
            release/release-manifest.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 2

  draft:
    if: github.event_name == 'push'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: candidate-release
          path: release

      - id: release
        name: Create or reuse exactly one unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ needs.validate.outputs.source-revision }}
        run: |
          release_id_from_json() {
            python3 - "$1" "$2" "$RELEASE_TAG" "$SOURCE_REVISION" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          mode = sys.argv[2]
          if mode == "pages":
              releases = [release for page in data for release in page]
              matches = [release for release in releases if release.get("tag_name") == sys.argv[3]]
          elif mode == "release":
              matches = [data]
          else:
              raise SystemExit("invalid release-validation mode")
          if len(matches) > 1:
              raise SystemExit(f"found {len(matches)} releases for {sys.argv[3]}; refusing to choose one")
          if not matches:
              raise SystemExit(3)
          release = matches[0]
          if release.get("tag_name") != sys.argv[3]:
              raise SystemExit("release response describes a different tag")
          if release.get("draft") is not True:
              raise SystemExit(f"release {sys.argv[3]} is already published")
          if release.get("target_commitish") != sys.argv[4]:
              raise SystemExit("release targets a different source revision")
          release_id = release.get("id")
          if not isinstance(release_id, int) or isinstance(release_id, bool) or release_id <= 0:
              raise SystemExit("draft release has an invalid database ID")
          print(release_id)
          PY
          }

          inspect_release() {
            gh api --paginate --slurp "/repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json" || return "$?"
            release_id_from_json "$RUNNER_TEMP/releases.json" pages
          }

          if release_id="$(inspect_release)"; then
            :
          elif [ "$?" -eq 3 ]; then
            gh api --method POST "/repos/$GH_REPO/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$SOURCE_REVISION" \
              -f name="PCE $RELEASE_TAG" \
              -F draft=true \
              -F generate_release_notes=true > "$RUNNER_TEMP/created-release.json"
            release_id="$(release_id_from_json "$RUNNER_TEMP/created-release.json" release)"
          else
            exit 1
          fi

          gh api "/repos/$GH_REPO/releases/$release_id/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          python3 - "$RUNNER_TEMP/assets.json" "$RELEASE_TAG" > "$RUNNER_TEMP/assets.tsv" <<'PY'
          import json
          import re
          import sys

          assets = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {"release-manifest.json", "SHA256SUMS", f"pce-{sys.argv[2]}.tar.gz"}
          seen = set()
          for asset in assets:
              asset_id = asset.get("id")
              name = asset.get("name")
              if (
                  not isinstance(asset_id, int)
                  or isinstance(asset_id, bool)
                  or not isinstance(name, str)
                  or name not in expected
                  or name in seen
                  or not re.fullmatch(r"[A-Za-z0-9._-]+", name)
              ):
                  raise SystemExit("draft contains unexpected asset metadata")
              seen.add(name)
              print(asset_id, name, sep="\t")
          PY
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -n "$asset_id" ] || continue
            gh api --method DELETE "/repos/$GH_REPO/releases/assets/$asset_id"
          done < "$RUNNER_TEMP/assets.tsv"

          for asset_path in release/*.tar.gz release/release-manifest.json release/SHA256SUMS; do
            asset_name=$(basename "$asset_path")
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              --input "$asset_path" \
              "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$asset_name" \
              > /dev/null
          done
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  smoke-release:
    if: github.event_name == 'push'
    needs: [validate, draft]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      # GitHub requires write scope to download assets from an unpublished release.
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source-revision }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download assets from the exact private draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: |
          mkdir downloaded
          gh api "/repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          python3 - "$RUNNER_TEMP/assets.json" "$RELEASE_TAG" > "$RUNNER_TEMP/assets.tsv" <<'PY'
          import json
          import re
          import sys

          assets = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {"release-manifest.json", "SHA256SUMS", f"pce-{sys.argv[2]}.tar.gz"}
          names = [asset.get("name") for asset in assets]
          if len(names) != len(expected) or set(names) != expected:
              raise SystemExit(f"draft assets do not match the candidate: {names!r}")
          for asset in assets:
              asset_id = asset.get("id")
              name = asset.get("name")
              if not isinstance(asset_id, int) or not re.fullmatch(r"[A-Za-z0-9._-]+", name):
                  raise SystemExit("draft contains invalid asset metadata")
              print(asset_id, name, sep="\t")
          PY
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api "/repos/$GH_REPO/releases/assets/$asset_id" \
              -H "Accept: application/octet-stream" > "downloaded/$asset_name"
          done < "$RUNNER_TEMP/assets.tsv"

      - name: Install the downloaded draft through the universal installer
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p served/download/"$RELEASE_TAG"
          cp downloaded/* served/download/"$RELEASE_TAG"/
          python3 -m http.server 8765 --directory served > "$RUNNER_TEMP/pce-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            "http://127.0.0.1:8765/download/$RELEASE_TAG/release-manifest.json" > /dev/null
          PCE_RELEASE_BASE_URL=http://127.0.0.1:8765 \
            sh install.sh --version "$version" --prefix "$RUNNER_TEMP/pce"
          "$RUNNER_TEMP/pce/bin/pce" --version | grep -Fx "pce $version"

  smoke-dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source-revision }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v7
        with:
          name: candidate-release
          path: downloaded

      - name: Install the exact dry-run candidate in a clean job
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p served/download/"$RELEASE_TAG"
          cp downloaded/* served/download/"$RELEASE_TAG"/
          python3 -m http.server 8765 --directory served > "$RUNNER_TEMP/pce-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            "http://127.0.0.1:8765/download/$RELEASE_TAG/release-manifest.json" > /dev/null
          PCE_RELEASE_BASE_URL=http://127.0.0.1:8765 \
            sh install.sh --version "$version" --prefix "$RUNNER_TEMP/pce"
          "$RUNNER_TEMP/pce/bin/pce" --version | grep -Fx "pce $version"

  publish:
    if: github.event_name == 'push'
    needs: [validate, draft, smoke-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish only the downloaded and installed draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
          SOURCE_REVISION: ${{ needs.validate.outputs.source-revision }}
        run: |
          gh api "/repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$RELEASE_ID" "$RELEASE_TAG" "$SOURCE_REVISION" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = (int(sys.argv[2]), sys.argv[3], sys.argv[4], True)
          actual = (
              release.get("id"),
              release.get("tag_name"),
              release.get("target_commitish"),
              release.get("draft"),
          )
          if actual != expected:
              raise SystemExit("the pinned draft changed before publication")
          PY
          gh api --method PATCH "/repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false > /dev/null
